<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 85" width="100%" height="100%">
  <defs>
    <!-- Gradiente de transparência para o reflexo -->
    <linearGradient id="reflection-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1.0" />
    </linearGradient>

    <!-- Grupo com o texto principal estilizado -->
    <g id="mockito-logo">
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="-2">
        <tspan fill="#6B9E1E">mock</tspan><tspan fill="#000000">ito</tspan>
      </text>
    </g>
  </defs>

  <!-- Logo Principal -->
  <use href="#mockito-logo" />

  <!-- Reflexo Espelhado -->
  <g transform="translate(0, 84) scale(1, -0.45)" opacity="0.5">
    <use href="#mockito-logo" />
    <!-- Máscara de degradação do reflexo -->
    <rect x="0" y="0" width="250" height="60" fill="url(#reflection-fade)" />
  </g>
</svg>
